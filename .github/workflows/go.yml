name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go-version: ['1.26','1.27']
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      GOTOOLCHAIN: local

    steps:
    - uses: actions/checkout@v7

    - name: Go ${{ matrix.go-version }} on ${{ matrix.os }}
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}

    - name: Display Go version
      run: go version

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

    - name: Self-Format
      run: go run . -rr -d ./...

    - name: Race detector
      if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.27'
      run: go test -race ./...
      
    - name: staticcheck
      run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
